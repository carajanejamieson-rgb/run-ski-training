<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Run + Ski Plan</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#17212b;--muted:#65727e;--line:#dbe3e8;--brand:#0f766e;--brand2:#115e59;--soft:#e7f4f2}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:18px 14px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.top h1{margin:0;font-size:25px}.muted{color:var(--muted)}.small{font-size:13px}.pct{font-size:25px;font-weight:800;color:var(--brand);text-align:right}.bar{height:9px;background:#dfe6e9;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar>div{height:100%;background:var(--brand);width:0}.tabs,.gymtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.gymtabs{grid-template-columns:1fr 1fr}.btn{border:1px solid #cbd5da;background:#fff;padding:11px 9px;border-radius:12px;font-weight:700;color:var(--ink)}.btn.active{background:var(--brand);color:white;border-color:var(--brand)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:0 1px 3px #0f172a0d}.weekhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:center}.weekhead h2{font-size:18px;margin:2px 0}.eyebrow{text-transform:uppercase;letter-spacing:.07em;color:var(--brand);font-size:11px;font-weight:800}.task{display:flex;gap:12px;align-items:flex-start}.task input{width:21px;height:21px;accent-color:var(--brand);margin-top:2px}.task strong{display:block}.task.done strong{text-decoration:line-through;color:#78838c}.formlabel{font-weight:700;display:block;margin-bottom:6px}select,textarea,input[type=text]{width:100%;border:1px solid #cbd5da;border-radius:10px;background:#fff;padding:10px;color:var(--ink)}textarea{min-height:85px;resize:vertical}.inline{display:flex;justify-content:space-between;gap:12px;align-items:center}.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;padding:7px}.weekrow{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left}.badge{font-weight:800;color:var(--brand)}.exercise .dose{color:var(--muted);font-size:13px;margin-top:5px}.info{background:var(--soft);border-color:#bfdfda}.footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212b;--ink:#edf4f7;--muted:#a8b3bd;--line:#33424e;--soft:#163c3a}.btn,select,textarea,input[type=text]{background:#17212b;color:#edf4f7;border-color:#455663}.btn.active{background:#0f766e}.bar{background:#33424e}}@media(max-width:390px){.app{padding-left:10px;padding-right:10px}.btn{font-size:13px}.weekhead{grid-template-columns:72px 1fr 72px}.top h1{font-size:22px}}
</style></head>
<body><div id="app" class="app"><header><div class="top"><div><h1>Run + Ski Plan</h1><div class="muted small">12 weeks of running, ski strength, cycling and mobility</div></div><div><div id="overallPct" class="pct">0%</div><div class="muted small">overall</div></div></div><div class="bar"><div id="overallBar"></div></div></header><nav class="tabs"><button class="btn active" data-view="week">This week</button><button class="btn" data-view="plan">12 weeks</button><button class="btn" data-view="gym">Gym</button></nav><main id="content"></main><div class="footer-note">Progress is stored in this browser on this device.</div></div>
<script>
(()=>{
const W=[
['23-29 Nov','Settle into the routine','25 min easy','10 min warm-up; 6 x 1 min hard / 1 min easy; 10 min cool-down','30 min easy','Gym A + Gym B','Yoga or 20-30 min mobility'],
['30 Nov-6 Dec','Build consistency','30 min easy','10 min easy; 10 min tempo; 10 min easy','40 min easy','Gym A + Gym B','Yoga or 20-30 min mobility'],
['7-13 Dec','Build strength','35 min easy','10 min warm-up; 5 x 2 min hard / 90 sec easy; 10 min cool-down','50 min easy','Gym A + Gym B','Yoga or 20-30 min mobility'],
['14-20 Dec','Lighter running week','30 min easy','10 min easy; 15 min tempo; 10 min easy','40 min easy','Gym A + Gym B','Yoga or 20-30 min mobility'],
['21-27 Dec','Maintain through Christmas','40 min easy','10 min warm-up; 8 x 1 min hard/easy; 10 min cool-down','60 min easy','Gym A + Gym B','Optional: 30 min steady run or 60-75 min cycle'],
['28 Dec-3 Jan','Taper into skiing','30-40 min easy','Optional short quality session only if fresh','Skiing can replace long run','One light gym session early in week','Mobility; no heavy legs in final 3-4 days'],
['4-10 Jan','Recover from skiing','30-45 min easy','10 min warm-up; 20 min fartlek; 10 min cool-down','60-80 min easy','One light maintenance gym','Optional: 40 min steady run or cycle'],
['11-17 Jan','Recovery and consolidation','30 min easy','10 min warm-up; 2 x 10 min tempo, 3 min recovery; 10 min cool-down','90 min easy','One maintenance gym','Yoga or 20-30 min mobility'],
['18-24 Jan','Build again','40 min easy','10 min warm-up; 5 x 5 min hard / 2 min easy; 10 min cool-down','30 min easy; 15 min target pace; 30 min easy','One maintenance gym','Optional: 45 min easy run or 60-75 min cycle'],
['25-31 Jan','Endurance week','45 min easy','10 min warm-up; 10 x 1 min hard/easy; 10 min cool-down','2 hours easy','One light/moderate maintenance gym','Prioritise recovery and mobility'],
['1-7 Feb','Consolidate','45 min easy','10 min warm-up; 8 x 2 min hard/easy; 10 min cool-down','40 min easy; 25 min target pace; 30 min easy','One maintenance gym','Optional: 40 min steady run or cycle'],
['8-14 Feb','Absorb the training','30 min easy','10 min warm-up; 3 x 8 min tempo, 3 min recovery; 10 min cool-down','90 min easy','One maintenance gym','Yoga or 20-30 min mobility']];
const G={A:[['Warm-up','90/90 hip switches + knee-to-wall','8-10 each side'],['Anchor','Bulgarian split squat','3 x 6-8 each side'],['Anchor','Single-leg RDL','3 x 8 each side'],['Choice 1','Cossack squat|Seated single-leg squat','3 x 6-8 each side'],['Choice 2','Tibialis raises|Single-leg extensions','3 x 12-20'],['Anchor','Wall sit','3 x 45-90 sec'],['Choice 3','Copenhagen plank|Side-lying leg raises','2-3 sets each side'],['Cool-down','Couch stretch|Figure-four stretch','30-45 sec each side']],B:[['Warm-up','90/90 hip switches + knee-to-wall + light Cossack squats','6-10 each side'],['Anchor','Bulgarian split squat|Reverse lunge','3 x 8 each side'],['Choice 1','Single-leg RDL|Seated single-leg squat','3 x 8 each side'],['Choice 2','Side-lying leg raises|Single-leg extensions','3 x 10-15 each side'],['Lower leg','Tibialis raises','3 x 15-20'],['Endurance','Wall sit','3 x 45-90 sec'],['Choice 3','Copenhagen plank|Cossack squat','2-3 sets'],['Cool-down','Frog stretch|Pigeon stretch|Couch stretch','Choose 2; 30-45 sec each side']]};
let S={week:0,view:'week',done:{},energy:{},notes:{},choices:{},weights:{}};try{const x=localStorage.getItem('runSki12');if(x)S={...S,...JSON.parse(x)}}catch(e){}
const app=document.getElementById('app'),content=document.getElementById('content');
function save(){try{localStorage.setItem('runSki12',JSON.stringify(S))}catch(e){}progress()}
function tasks(w){const x=W[w];return [['Easy run',x[2]],['Quality run',x[3]],['Long run',x[4]],['Strength',x[5]],['Mobility / flex',x[6]],['Cycle commute','Tuesday, Wednesday and Thursday when in the office']]}
const k=(w,i)=>`w${w}t${i}`;
function progress(){const total=72,done=Object.values(S.done).filter(Boolean).length,p=Math.round(done/total*100);document.getElementById('overallPct').textContent=p+'%';document.getElementById('overallBar').style.width=p+'%'}
function current(){const n=new Date(),dates=['2026-11-23','2026-11-30','2026-12-07','2026-12-14','2026-12-21','2026-12-28','2027-01-04','2027-01-11','2027-01-18','2027-01-25','2027-02-01','2027-02-08'].map(x=>new Date(x+'T00:00:00'));let z=0;dates.forEach((d,i)=>{if(n>=d)z=i});return Math.max(0,Math.min(11,z))}
function week(){const w=S.week,x=W[w],ts=tasks(w),num=ts.filter((_,i)=>S.done[k(w,i)]).length;return `<div class="card"><div class="weekhead"><button class="btn" id="prev" ${w===0?'disabled':''}>Previous</button><div><div class="eyebrow">Week ${w+1}</div><h2>${x[0]}</h2><div class="muted small">${x[1]}</div></div><button class="btn" id="next" ${w===11?'disabled':''}>Next</button></div><div class="inline small" style="margin-top:13px"><span>${num} of 6 complete</span><button class="linkbtn" id="jump">Current week</button></div></div>${ts.map((t,i)=>`<label class="card task ${S.done[k(w,i)]?'done':''}"><input type="checkbox" data-task="${i}" ${S.done[k(w,i)]?'checked':''}><span><strong>${t[0]}</strong><span class="muted small">${t[1]}</span></span></label>`).join('')}<div class="card"><label class="formlabel" for="energy">Legs / energy</label><select id="energy"><option value="">Select</option>${['Good','Tired','Struggling'].map(v=>`<option ${S.energy[w]===v?'selected':''}>${v}</option>`).join('')}</select><label class="formlabel" for="notes" style="margin-top:13px">Week notes</label><textarea id="notes" placeholder="Pace, gym weights, how you felt...">${S.notes[w]||''}</textarea></div><div class="card info"><strong>Flex rule</strong><div class="muted small" style="margin-top:4px">Swap an easy or optional steady run for 45-90 minutes of easy/moderate cycling when useful. Protect the quality and long runs where possible.</div></div>`}
function plan(){return W.map((x,w)=>{const n=tasks(w).filter((_,i)=>S.done[k(w,i)]).length;return `<button class="card weekrow" data-open="${w}"><span><strong>Week ${w+1}: ${x[0]}</strong><span class="muted small" style="display:block">${x[1]}</span></span><span class="badge">${n}/6</span></button>`}).join('')}
function gymBlock(type){return `<div class="card"><div class="eyebrow">Gym ${type}</div><strong>${type==='A'?'Strength and single-leg control':'Ski endurance and stability'}</strong></div>${G[type].map((r,i)=>{const opts=r[1].split('|'),ck=`g${type}${i}`,chosen=S.choices[ck]||opts[0];return `<div class="card exercise"><div class="eyebrow">${r[0]}</div>${opts.length>1?`<select data-choice="${ck}">${opts.map(o=>`<option ${chosen===o?'selected':''}>${o}</option>`).join('')}</select>`:`<strong>${r[1]}</strong>`}<div class="dose">${r[2]}</div><input type="text" data-weight="${ck}" style="margin-top:9px" placeholder="Weight / reps / note" value="${S.weights[ck]||''}"></div>`}).join('')}`}
function gym(){return `<div class="gymtabs"><button class="btn active" data-gym="A">Gym A</button><button class="btn" data-gym="B">Gym B</button></div><div id="gymbody">${gymBlock('A')}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));content.innerHTML=S.view==='week'?week():S.view==='plan'?plan():gym();bind();progress()}
function bind(){document.querySelectorAll('[data-task]').forEach(x=>x.onchange=e=>{S.done[k(S.week,+e.target.dataset.task)]=e.target.checked;save();render()});const p=document.getElementById('prev'),n=document.getElementById('next'),j=document.getElementById('jump');if(p)p.onclick=()=>{S.week--;render()};if(n)n.onclick=()=>{S.week++;render()};if(j)j.onclick=()=>{S.week=current();render()};const e=document.getElementById('energy'),no=document.getElementById('notes');if(e)e.onchange=x=>{S.energy[S.week]=x.target.value;save()};if(no)no.oninput=x=>{S.notes[S.week]=x.target.value;save()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.week=+b.dataset.open;S.view='week';render()});document.querySelectorAll('[data-gym]').forEach(b=>b.onclick=()=>{document.getElementById('gymbody').innerHTML=gymBlock(b.dataset.gym);document.querySelectorAll('[data-gym]').forEach(x=>x.classList.toggle('active',x===b));bind()});document.querySelectorAll('[data-choice]').forEach(x=>x.onchange=e=>{S.choices[e.target.dataset.choice]=e.target.value;save()});document.querySelectorAll('[data-weight]').forEach(x=>x.oninput=e=>{S.weights[e.target.dataset.weight]=e.target.value;save()})}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render()});S.week=current();render();
})();
</script></body></html>
